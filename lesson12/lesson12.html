<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lesson 12 Exercises - Flexbox</title>
  <style>
    body {
      font-family: Arial;
    }

    .container {
      margin-bottom: 30px;
    }

    .box {
      background-color: lightblue;
      border: 1px solid black;
      text-align: left;
      padding: 10px;
    }

    .flex-12a {
      display: flex;
    }

    .item-200 {
      width: 200px;
      background-color: lightblue;
    }

    .item-75 {
      width: 75px;
      background-color: pink;
    }

    .flex-12b {
      display: flex;
    }

    .item-50 {
      width: 50px;
      background-color: lightblue;
    }

    .item-flex {
      flex: 1;
      background-color: lightgray;
    }

    .item-75b {
      width: 75px;
      background-color: lightpink;
    }

    .flex-12c {
      display: flex;
      justify-content: space-between;
    }

    .flex-12d {
      display: flex;
      justify-content: space-between;
      border: 1px solid gray;
      height: 50px;
      align-items: center;
      padding: 0 10px;
    }

    .card {
      width: 200px;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }

    .notif {
      background-color: blue;
      color: white;
      border-radius: 50px;
      padding: 2px 8px;
      font-size: 12px;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #6f4bb8;
      padding: 10px;
      color: white;
    }

    .search {
      flex: 1;
      margin: 0 10px;
    }

    .search input {
      width: 99%;
      padding: 5px;
      border-radius: 20px;
      border: none;
    }

    .btn {
      background-color: transparent;
      border: 1px solid white;
      color: white;
      padding: 5px 10px;
      border-radius: 3px;
    }

    .tweet {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      max-width: 500px;
      margin-bottom: 15px;
    }

    .profile-img{
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }

    .tweet-content{
      flex: 1;
      min-width: 0;
      width: 100%;
    }

    .tweet-header{
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .name{
      font-weight: bold;
    }

    .username-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
      gap: 20px;
    }

    .username{
      color: gray;
    }

    .follow-btn{
      background-color: #1DA1F2;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 4px 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tweet-text{
      margin-top: 5px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

<br>
<h1>12a</h1>
  <div class="container flex-12a">
    <div class="item-200 box">200px</div>
    <div class="item-75 box">75px</div>
  </div>

<br>
<h1>12b</h1>
  <div class="container flex-12b">
    <div class="item-50 box">item1</div>
    <div class="item-flex box">item2</div>
    <div class="item-75b box">item3</div>
  </div>

<br>
<h1>12c</h1>
    <div class="container flex-12c">
    <div class="box">item1</div>
    <div class="box">item2</div>
    <div class="box">item3</div>
    <div class="box">item4</div>
  </div>

<br>
<h1>12d</h1>
    <div class="container flex-12d">
    <div class="box">item1</div>
    <div class="box">item2</div>
  </div>

<br>
<h1><u>Challenge Exercises</u></h1>
<h1>12e</h1>
    <div class="container card">
    <div class="card-row">
      <span>Home</span>
      <span class="notif">14</span>
    </div>
    <div class="card-row">
      <span>Notifications</span>
      <span class="notif">3</span>
    </div>
    <div class="card-row">
      <span>Messages</span>
      <span class="notif">5</span>
    </div>
  </div>

<br>
<h1>12f</h1>  
    <div class="container navbar">
    <div>Home</div>
    <div class="search">
      <input type="text" placeholder="Search">
    </div>
    <button class="btn">Download</button>
  </div>
  <br>

<h1>12g</h1>
<div class="tweet">
  <img src="arceus pc.png" alt="Profile" class="profile-img">
  <div class="tweet-content">
    <div class="name">Arceus</div>
    <div class="row-username">
      <span class="username">godPokemon</span>
      <button class="follow-btn">Follow</button>

  </div>
</div>

<div class="tweet">
  <img src="palkia pc.png" alt="Profile" class="profile-img">
  <div class="tweet-content">
    <div class="name">Palkia</div>
    <div class="row-username">
      <span class="username">spaceKia</span>
      <button class="follow-btn">Follow</button>
    </div>
    <p class="tweet-text">Ruler of space</p>
  </div>
</div>

<div class="tweet">
  <img src="dialga pc.png" alt="Profile" class="profile-img">
  <div class="tweet-content">
    <div class="name">Dialga</div>
    <div class="row-username">
      <span class="username">timePoks</span>
      <button class="follow-btn">Follow</button>
    </div>
    <p class="tweet-text">I am the time Pokemon.</p>
  </div>
</div>
</body>
</html>
